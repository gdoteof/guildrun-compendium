<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entity — Guildrun Compendium</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="hdr"></div>
<main id="main"><p class="small">Loading…</p></main>

<script type="module">
import { api, esc, header, tierBadge, winBar, fmtLift, rarityLabel,
         iconImg, fmtMarkup, statChips, loadCatalog, entityLink } from "/app.js";
document.getElementById("hdr").outerHTML = header("");

const params = new URLSearchParams(location.search);
const type = params.get("type"), ref = params.get("ref");
const main = document.getElementById("main");

/* Hero base-stat grid; keys match the extracted sheet stats. */
const heroStats = (s) => {
  const rows = [["Max HP"], ["Defense"], ["Attack"], ["Magic"],
    ["Base Attack Damage", "Base Attack"], ["Attack Speed"], ["Base Attack Speed"],
    ["Crit"], ["Max Mana"], ["Starting Mana"], ["Mana Regen"],
    ["Attack Range", "Range"], ["Move Speed"]]
    .filter(([k]) => s[k] !== undefined && s[k] !== 0);
  if (!rows.length) return "";
  return `<div class="tiles">${rows.map(([k, label]) => `
    <div class="tile"><div class="v">${esc(s[k])}</div><div class="k">${esc(label ?? k)}</div></div>`).join("")}</div>`;
};

const descBlock = (meta) => {
  const lines = [];
  if (Array.isArray(meta.Stats) && meta.Stats.length) {
    lines.push(`<p>${statChips(meta.Stats)}</p>`);
  }
  if (meta.Description) lines.push(`<p>${fmtMarkup(meta.Description, meta.DescriptionValues)}</p>`);
  if (meta.QuestDescription) {
    lines.push(`<p><strong>Quest:</strong> ${fmtMarkup(meta.QuestDescription, meta.QuestDescriptionValues)}</p>`);
  }
  if (meta.QuestRewardDescription) {
    lines.push(`<p><strong>Reward:</strong> ${fmtMarkup(meta.QuestRewardDescription, meta.QuestRewardDescriptionValues)}</p>`);
  }
  return lines.join("");
};

/* Hero extras: class/guild/price line plus ability cards from the catalog. */
async function heroPanel(meta) {
  const bits = [];
  if (meta.Classes) bits.push(esc(meta.Classes.join(" / ")));
  if (meta.Guild) bits.push(`${esc(meta.Guild)} guild`);
  if (meta.Price) bits.push(`${esc(meta.Price[0])} shards`);
  if (meta.Tags?.length) bits.push(meta.Tags.map(esc).join(", "));
  const head = bits.length ? `<p class="small">${bits.join(" · ")}</p>` : "";

  const cat = await loadCatalog();
  const abilities = [["ActiveAbility", "active_ability", "Active ability"],
    ["PassiveAbility", "passive_ability", "Passive"]]
    .map(([key, etype, label]) => {
      const aref = meta[key];
      const a = aref && cat?.[etype]?.[aref];
      if (!a) return "";
      return `<div class="card" style="margin:0.6rem 0">
        <strong>${label}: ${iconImg(aref, 22)}${esc(a.name)}</strong>
        ${a.meta?.Description ? `<div>${fmtMarkup(a.meta.Description, a.meta.DescriptionValues)}</div>` : ""}
      </div>`;
    }).join("");
  return head + abilities;
}

try {
  const e = await api(`/entity/${encodeURIComponent(type)}/${encodeURIComponent(ref)}`);
  document.title = `${e.name} — Guildrun Compendium`;
  const all = e.contexts.find((c) => c.ctx_version === "all" && c.ctx_difficulty === 0 && c.ctx_floor_band === "all");
  const meta = e.meta ?? {};
  main.innerHTML = `
    <h2 style="font-size:1.3rem;margin-bottom:2px;display:flex;align-items:center;gap:8px">
      ${iconImg(ref, 40)}${esc(e.name)}
      ${all ? tierBadge(all.tier) : ""} ${rarityLabel(e.rarity)}</h2>
    <p class="small">${esc(ref)}${meta.Pools?.length ? " · " + meta.Pools.map(esc).join(", ") : ""}</p>
    ${descBlock(meta)}
    <div id="hero-extra"></div>
    ${type === "hero" && meta.Stats ? heroStats(meta.Stats) : ""}
    ${all ? `<div class="tiles">
      <div class="tile"><div class="v">${all.n_battles}</div><div class="k">battles fielded</div></div>
      <div class="tile"><div class="v">${all.n_battles ? Math.round((all.battle_wins / all.n_battles) * 100) + "%" : "–"}</div><div class="k">battle win rate</div></div>
      <div class="tile"><div class="v">${all.n_runs}</div><div class="k">runs</div></div>
      <div class="tile"><div class="v">${all.n_runs ? Math.round((all.run_beats / all.n_runs) * 100) + "%" : "–"}</div><div class="k">run beat rate</div></div>
      ${all.deaths ? `<div class="tile"><div class="v">${all.deaths}</div><div class="k">deaths</div></div>` : ""}
    </div>` : ""}
    <div class="card">
      <h3 style="margin-top:0;font-size:0.95rem">By context</h3>
      <table class="stats"><thead><tr>
        <th>version</th><th class="num">difficulty</th><th>floors</th>
        <th class="num">battles</th><th>battle win rate</th>
        <th class="num">runs</th><th>run beat rate</th><th class="num">lift</th><th>tier</th>
      </tr></thead><tbody>
      ${e.contexts.map((c) => `
        <tr>
          <td>${esc(c.ctx_version)}</td>
          <td class="num">${c.ctx_difficulty === 0 ? "all" : c.ctx_difficulty}</td>
          <td>${esc(c.ctx_floor_band)}</td>
          <td class="num">${c.n_battles}</td>
          <td>${winBar(c.battle_wins, c.n_battles)}</td>
          <td class="num">${c.n_runs || ""}</td>
          <td>${c.n_runs ? winBar(c.run_beats, c.n_runs) : ""}</td>
          <td class="num">${fmtLift(c.run_lift ?? c.battle_lift)}</td>
          <td>${tierBadge(c.tier)}</td>
        </tr>`).join("")}
      </tbody></table>
    </div>`;
  if (type === "hero") {
    document.getElementById("hero-extra").innerHTML = await heroPanel(meta);
  }
} catch {
  main.innerHTML = `<p>Not found.</p>`;
}
</script>
</body>
</html>
